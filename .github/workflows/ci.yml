  coverage-0:
    name: Coverage 0/2
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Run test partition 0/2 with coverage
        run: |
          set -o pipefail
          nix build -L \
            --out-link "$RUNNER_TEMP/coverage-result" \
            .#checks.x86_64-linux.coverage-0-of-2 \
            2>&1 | tee "$RUNNER_TEMP/coverage-0-of-2.log"

      - name: Prepare shard tracefiles
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-shard"
          cp -aL "$RUNNER_TEMP/coverage-result/coverage.info" \
            "$RUNNER_TEMP/coverage-result/summary.txt" \
            "$RUNNER_TEMP/coverage-shard/"

      - name: Upload shard tracefiles
