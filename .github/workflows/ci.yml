name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-deb:
    name: Ubuntu package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Ubuntu toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            clang \
            dpkg-dev \
            file \
            glslang-tools \
            libbrotli-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            librsvg2-bin \
            libutf8proc-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            lintian \
            pkg-config \
            python3 \
            ragel \
            wayland-protocols

      - name: Build Ubuntu package
        run: python3 dev/build_deb.py --output-directory dist

      - name: Validate Ubuntu package
        run: |
          packages=(dist/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "expected one Debian package, found ${#packages[@]}" >&2
            exit 1
          fi
          python3 dev/check_deb.py "${packages[0]}"
          sudo apt-get --simulate install "./${packages[0]}"
          lintian --fail-on error "${packages[0]}"

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Build package
        run: |
          set -o pipefail
          nix build -L --no-link \
            .#checks.x86_64-linux.build \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build" \
            --reproduce "nix build -L --no-link .#checks.x86_64-linux.build"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests:
    name: Tests Linux
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Run full test suite
        run: |
          set -o pipefail
          nix build -L --no-link \
            .#checks.x86_64-linux.tests \
            2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests Linux" \
            --reproduce "nix build -L --no-link .#checks.x86_64-linux.tests"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
