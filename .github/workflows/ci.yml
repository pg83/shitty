      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Run full test suite with UBSan
        run: |
          set -o pipefail
          nix build -L --no-link \
            .#checks.x86_64-linux.tests-ubsan \
            2>&1 | tee "$RUNNER_TEMP/tests-ubsan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-ubsan.log" \
            --title "Tests UBSan" \
            --reproduce "nix build -L --no-link .#checks.x86_64-linux.tests-ubsan"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-ubsan-log
          path: ${{ runner.temp }}/tests-ubsan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
