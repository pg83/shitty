  coverage:
    name: Coverage
    needs:
      - coverage-0
      - coverage-1
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Download shard tracefiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage-shards

      - name: Merge shard tracefiles
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/coverage-report"
          mkdir -p "$report"
          python3 dev/merge_lcov.py \
            --output "$report/coverage.info" \
            --summary "$report/summary.txt" \
            "$RUNNER_TEMP"/coverage-shards/coverage-shard-*/coverage.info
          {
            echo "## Merged coverage"
            echo
            echo '```text'
            cat "$report/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render browsable report
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/coverage-report"
          nix shell --inputs-from . nixpkgs#lcov -c genhtml \
            --branch-coverage \
            --ignore-errors inconsistent,category,count,range,source \
            --output-directory "$report/html" \
            "$report/coverage.info"

      - name: Upload browsable coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage-report/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-clang
          verbose: true

