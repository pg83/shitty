      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-asan-log
          path: ${{ runner.temp }}/build-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-asan:
    name: Tests ASan
    needs: [tests, build-asan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Run full test suite with ASan
        run: |
          set -o pipefail
          nix build -L --no-link \
            .#checks.x86_64-linux.tests-asan \
            2>&1 | tee "$RUNNER_TEMP/tests-asan.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-asan.log" \
            --title "Tests ASan" \
            --reproduce "nix build -L --no-link .#checks.x86_64-linux.tests-asan"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-log
          path: ${{ runner.temp }}/tests-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-ubsan:
    name: Build UBSan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
