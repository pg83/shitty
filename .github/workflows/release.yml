name: Release

# The release button: builds and tests both supported platforms from the
# current master, then publishes the next numeric tag after all four jobs have
# succeeded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (empty picks the next number)
        required: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: 487d974011527cf9face187dc2214c271377b508
          path: .ix

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autopoint binutils bison bzip2 ca-certificates clang cmake curl file flex gettext \
            git glslang-tools gperf gzip libclang-rt-dev librsvg2-bin \
            lld llvm m4 make meson ninja-build perl pkg-config python3 ragel rsync xz-utils

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Linux binaries through IX
        env:
          IX_FLAGS: all_system=1,intl_ver=no,system_aclocal_path=/usr/share/aclocal
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/linux-build-diagnostics"
          .ix/ix run \
            --target=x86_64-linux \
            --libdlfcn_ver=elf \
            bld/compiler \
            bin/clang/env \
            lib/c \
            lib/c++ \
            lib/freetype \
            lib/fontconfig \
            lib/harfbuzz \
            lib/brotli \
            lib/simd/utf \
            lib/linux/headers \
            lib/wayland \
            lib/wayland/dl \
            lib/xkb/common \
            lib/vulkan/loader \
            lib/vulkan/headers \
            bld/wayland \
            bin/ragel/6 \
            bin/glslang \
            -- \
            dev/build_release_linux.sh \
              "$RUNNER_TEMP/build-linux" \
              "$RUNNER_TEMP/linux-build-diagnostics" \
            2>&1 \
            | tee "$RUNNER_TEMP/linux-build-diagnostics/build.log" \
            | python3 dev/prefix_timestamps.py

      - name: Upload Linux build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-build-diagnostics
          path: ${{ runner.temp }}/linux-build-diagnostics/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stage Linux binaries
        run: |
          mkdir -p "$RUNNER_TEMP/linux-x86_64"
          for binary in st pt; do
            cp -L "$RUNNER_TEMP/build-linux/$binary" "$RUNNER_TEMP/linux-x86_64/$binary"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-linux-alpine:
    name: Test Linux artifact on Alpine
    needs: build-linux
    runs-on: ubuntu-26.04
    container: alpine:3.24
    timeout-minutes: 15
    steps:
      - name: Install release test dependencies
        run: |
          apk add --no-cache \
            binutils coreutils file gcompat git mesa-vulkan-swrast \
            weston weston-backend-x11 xvfb

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-test-logs-alpine
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  test-linux-fedora:
    name: Test Linux artifact on Fedora
    needs: build-linux
    runs-on: ubuntu-26.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Install release test dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False \
            --setopt=retries=10 --setopt=timeout=60 --setopt=zchunk=False \
            install \
            binutils coreutils file mesa-vulkan-drivers weston xorg-x11-server-Xvfb

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-test-logs-fedora
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  test-linux-ubuntu:
    name: Test Linux artifact on Ubuntu
    needs: build-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Install release test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils coreutils file mesa-vulkan-drivers weston xvfb

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-test-logs-ubuntu
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-darwin:
    name: Build Darwin artifacts
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          brew install llvm ragel glslang spirv-cross librsvg
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Build Darwin binaries
        run: dev/build_brew_macos.sh

      - name: Stage Darwin binaries
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-arm64"
          cp -L .build-darwin/st .build-darwin/pt "$RUNNER_TEMP/darwin-arm64/"

      # Wraps the same two binaries staged above in a proper .app bundle
      # (Info.plist, a generated .icns) for direct, double-clickable
      # distribution. The loose st/pt staged above are untouched and keep
      # feeding the Homebrew tap exactly as before — this is additive, not a
      # replacement, because the tap's formula lives in a separate repo
      # (pg83/homebrew-tap) this workflow cannot update in lockstep.
      - name: Package Darwin app bundles
        run: |
          dev/package_macos_app.sh \
            "Shitty" com.pg83.shitty st bin/st/shitty.svg \
            "$RUNNER_TEMP/darwin-arm64/st" \
            "$RUNNER_TEMP/darwin-arm64/Shitty.app"
          dev/package_macos_app.sh \
            "Pretty" com.pg83.pretty pt bin/pt/pretty.svg \
            "$RUNNER_TEMP/darwin-arm64/pt" \
            "$RUNNER_TEMP/darwin-arm64/Pretty.app"

      - name: Upload Darwin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-arm64
          path: |
            ${{ runner.temp }}/darwin-arm64/st
            ${{ runner.temp }}/darwin-arm64/pt
            ${{ runner.temp }}/darwin-arm64/Shitty.app
            ${{ runner.temp }}/darwin-arm64/Pretty.app
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-darwin:
    name: Test Darwin artifacts
    needs: build-darwin
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Download Darwin artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64

      - name: Verify Darwin binaries
        run: |
          chmod +x "$RUNNER_TEMP/darwin-arm64/st" "$RUNNER_TEMP/darwin-arm64/pt"
          prefix="$(brew --prefix)"
          for binary in st pt; do
            path="$RUNNER_TEMP/darwin-arm64/$binary"
            file "$path"
            file "$path" | grep -q 'Mach-O 64-bit executable arm64'
            if otool -L "$path" | grep -Fq "$prefix"; then
              echo "release binary links Homebrew dylibs: $binary" >&2
              otool -L "$path" >&2
              exit 1
            fi
          done
          "$RUNNER_TEMP/darwin-arm64/st" -version | grep -q '^Shitty '
          "$RUNNER_TEMP/darwin-arm64/pt" -version | grep -q '^Pretty '

      # Catches a packaging bug (a malformed plist, a missing icon, the
      # wrong binary copied in) before Sign and Notarize spend Apple API
      # quota and several minutes signing and notarizing it.
      - name: Verify Darwin app bundles
        run: |
          for spec in "Shitty.app:st:Shitty:shitty" "Pretty.app:pt:Pretty:pretty"; do
            app=$(echo "$spec" | cut -d: -f1)
            executable=$(echo "$spec" | cut -d: -f2)
            display_name=$(echo "$spec" | cut -d: -f3)
            icon_name=$(echo "$spec" | cut -d: -f4)
            bundle="$RUNNER_TEMP/darwin-arm64/$app"

            plutil -lint "$bundle/Contents/Info.plist"
            test -f "$bundle/Contents/Resources/$icon_name.icns"

            chmod +x "$bundle/Contents/MacOS/$executable"
            path="$bundle/Contents/MacOS/$executable"
            file "$path"
            file "$path" | grep -q 'Mach-O 64-bit executable arm64'
            "$path" -version | grep -q "^$display_name "
          done

      - name: Test Metal through Cocoa
        run: |
          python3 - "$RUNNER_TEMP/darwin-arm64/st" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.argv[1],
                  "-geometry", "20x5",
                  "-e", "/bin/sh", "-c",
                  'printf "Metal Cocoa smoke\\n"; sleep 2',
              ],
              check=True,
              timeout=30,
          )
          PY

  # Runs after test-darwin, deliberately: signing and notarizing costs Apple
  # API quota and several minutes, and there is no reason to spend either on
  # a build that already failed the Metal/Cocoa smoke test.
  #
  # Every step below degrades to what this repo has always shipped — the
  # linker's ad-hoc signature, unsigned by any Developer ID, unnotarized —
  # when the secrets it reads are absent, rather than failing the release.
  # That is not hypothetical here: a fork gets none of this repo's secrets,
  # and a secret can be rotated away. See dev/docs/macos_signing.md for what
  # each secret is and why.
  sign-notarize-darwin:
    name: Sign and notarize Darwin artifacts
    needs:
      - build-darwin
      - test-darwin
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Download Darwin artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64

      # Sign the app bundles and the loose binaries separately. A bundle
      # signature binds the executable to Contents/Info.plist; copying that
      # executable out of the bundle leaves an invalid standalone signature
      # and macOS kills it on exec. Loose st/pt have their own signatures,
      # with no bundle Info.plist dependency.
      - name: Sign Darwin artifacts
        run: |
          chmod +x "$RUNNER_TEMP/darwin-arm64/st" "$RUNNER_TEMP/darwin-arm64/pt" \
            "$RUNNER_TEMP/darwin-arm64/Shitty.app/Contents/MacOS/st" \
            "$RUNNER_TEMP/darwin-arm64/Pretty.app/Contents/MacOS/pt"

          if [ -z "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]; then
            echo "::warning::No APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 — shipping"\
                 "the linker's ad-hoc signature, unnotarized, same as every"\
                 "release before this pipeline existed."
            exit 0
          fi

          kc="$RUNNER_TEMP/shitty-signing.keychain-db"
          # Not the .p12 password: this one is ours, lives for the job, and
          # is what set-key-partition-list actually wants (see
          # dev/docs/macos_signing.md for the bug this avoids).
          kcpw=$(openssl rand -base64 24)
          (umask 077; printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" \
              | base64 -d > "$RUNNER_TEMP/cert.p12")
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT

          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -T /usr/bin/codesign \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # Anchored on the certificate type, not just on any quoted
          # identity, so a wrong-secret Apple Development/Distribution .p12
          # (the easy mistake — the iOS pipeline deals in exactly those)
          # fails loudly here instead of silently producing an unnotarizable
          # signature.
          name=$(security find-identity -v -p codesigning "$kc" \
            | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -1)
          if [ -z "$name" ]; then
            echo "::error::Certificate imported but no Developer ID Application"\
                 "codesigning identity found — is"\
                 "APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 the right .p12?"
            exit 1
          fi

          for app in Shitty.app Pretty.app; do
            codesign --force --options runtime --timestamp --sign "$name" \
              "$RUNNER_TEMP/darwin-arm64/$app"
            codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/darwin-arm64/$app"
          done
          for binary in st pt; do
            codesign --force --options runtime --timestamp --sign "$name" \
              "$RUNNER_TEMP/darwin-arm64/$binary"
            codesign --verify --strict --verbose=2 "$RUNNER_TEMP/darwin-arm64/$binary"
          done

          echo "SHITTY_SIGNED=1" >> "$GITHUB_ENV"
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      # Only reached when Sign actually signed something — notarizing an
      # ad-hoc signature is refused by Apple anyway, so there is nothing
      # useful to submit without a Developer ID identity first.
      - name: Notarize and staple Darwin app bundles
        if: env.SHITTY_SIGNED == '1'
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ] || \
             [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || \
             [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ]; then
            echo "::warning::No App Store Connect API key secrets — shipping"\
                 "Developer ID signed but unnotarized bundles."
            exit 0
          fi

          # A filesystem PATH to the .p8, not the key's contents — notarytool
          # wants the file itself. RUNNER_TEMP dies with the job.
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT

          # ditto, not zip: it preserves the extended attributes and resource
          # forks notarytool expects from a bundle, which a plain zip does
          # not guarantee. Both apps go in one submission — one API round
          # trip, one ticket lookup, and notarytool inspects every signed
          # bundle it finds inside.
          #
          # `ditto -c` takes exactly ONE source ("Can't archive multiple
          # sources" otherwise, measured here) — --keepParent does not turn
          # it into a multi-source flag the way cp's semantics might
          # suggest. Stage both apps and both independently signed loose
          # binaries under one directory so one submission notarizes every
          # distribution shape.
          mkdir -p "$RUNNER_TEMP/darwin-submit"
          cp -R "$RUNNER_TEMP/darwin-arm64/Shitty.app" "$RUNNER_TEMP/darwin-arm64/Pretty.app" \
            "$RUNNER_TEMP/darwin-submit/"
          cp "$RUNNER_TEMP/darwin-arm64/st" "$RUNNER_TEMP/darwin-arm64/pt" \
            "$RUNNER_TEMP/darwin-submit/"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/darwin-submit" \
            "$RUNNER_TEMP/darwin-submit.zip"

          xcrun notarytool submit "$RUNNER_TEMP/darwin-submit.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --wait --timeout 20m \
            --output-format json | tee "$RUNNER_TEMP/notarize.json"

          id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$RUNNER_TEMP/notarize.json")
          status=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/notarize.json")
          echo "notarization $id: $status"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_API_ISSUER_ID"
            echo "::error::notarization did not succeed: $status"
            exit 1
          fi

          # Only a bundle can carry a stapled ticket — stapler has no form
          # for a loose Mach-O executable, so the notarized st/pt stay
          # staple-free. Gatekeeper still accepts them online by their own
          # code-signature hashes; a bundle's staple just skips that lookup.
          for app in Shitty.app Pretty.app; do
            xcrun stapler staple "$RUNNER_TEMP/darwin-arm64/$app"
            xcrun stapler validate "$RUNNER_TEMP/darwin-arm64/$app"
          done
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      # Informational, not a gate: spctl's online ticket lookup can be flaky
      # from a CI runner, and a false negative here should not fail a release
      # notarytool already accepted.
      - name: Verify Gatekeeper acceptance
        if: env.SHITTY_SIGNED == '1'
        run: |
          for binary in st pt; do
            # -dv only prints signature metadata; --verify and an actual
            # exec are what catch a broken standalone signature.
            codesign --verify --strict --verbose=4 "$RUNNER_TEMP/darwin-arm64/$binary"
            codesign -dv --verbose=4 "$RUNNER_TEMP/darwin-arm64/$binary"
            "$RUNNER_TEMP/darwin-arm64/$binary" -version
            spctl -a -vv -t execute "$RUNNER_TEMP/darwin-arm64/$binary" || true
          done
          for app in Shitty.app Pretty.app; do
            codesign -dv --verbose=4 "$RUNNER_TEMP/darwin-arm64/$app"
            spctl -a -vv -t execute "$RUNNER_TEMP/darwin-arm64/$app" || true
          done

      - name: Upload signed Darwin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-arm64-signed
          path: |
            ${{ runner.temp }}/darwin-arm64/st
            ${{ runner.temp }}/darwin-arm64/pt
            ${{ runner.temp }}/darwin-arm64/Shitty.app
            ${{ runner.temp }}/darwin-arm64/Pretty.app
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package-release:
    name: Package and publish release
    needs:
      - build-linux
      - test-linux-alpine
      - test-linux-fedora
      - test-linux-ubuntu
      - build-darwin
      - test-darwin
      - sign-notarize-darwin
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/release-input/linux-x86_64

      - name: Download Darwin artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-arm64-signed
          path: ${{ runner.temp }}/release-input/darwin-arm64

      - name: Let the release push tags
        run: |
          git config --global user.name "shitty release bot"
          git config --global user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create draft release
        run: |
          python3 dev/release.py ${{ inputs.tag }} --sha "$GITHUB_SHA" --generate-notes \
            --artifacts-directory "$RUNNER_TEMP/release-artifacts" --draft \
            --tag-file "$RUNNER_TEMP/release-tag" \
            --linux-binaries-directory "$RUNNER_TEMP/release-input/linux-x86_64" \
            --darwin-binaries-directory "$RUNNER_TEMP/release-input/darwin-arm64"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-artifacts/*.tar.gz'

      - name: Publish release
        run: gh release edit "$(cat "$RUNNER_TEMP/release-tag")" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
